# Synthetic two-project media regression fixture.
name: pod-sample-media
root: "~/projects"

before_start: []
after_start: []
on_pane_dead:
  - "echo pane-recovered >> /tmp/forge-fixture.log"

windows:
  - name: media
    layout: tiled
    panes:
      - cwd: "~/projects/sample-audio"
      - cwd: "~/projects/sample-voice"
