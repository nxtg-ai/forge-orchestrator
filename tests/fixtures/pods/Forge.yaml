# Synthetic four-pane regression fixture. No production topology or private paths.
name: sample-four-pane
root: "~/projects/sample-suite"
template: claude-team-pane

before_start: []
after_start: []
on_pane_dead:
  - "echo pane-recovered >> /tmp/forge-fixture.log"

windows:
  - name: agents
    layout: tiled
    panes:
      - cwd: "~/projects/sample-suite/app-a"
      - cwd: "~/projects/sample-suite/app-b"
      - cwd: "~/projects/sample-suite/app-c"
      - cwd: "~/projects/sample-suite"
