# Wolf — NXTG-AI Chief of Staff session.
# Single claude pane rooted in ASIF for portfolio governance.
#
# Spawn: cosmux start cos-wolf
name: cos-wolf
root: "~/ASIF"

before_start: []
after_start: []

on_pane_dead:
  - "echo \"$(date -Iseconds) cos-wolf pane died\" >> /tmp/cosmux-pane-dead.log"

windows:
  - name: wolf
    layout: tiled
    panes:
      - cwd: "~/ASIF"
        command: "ccyolo"
