# NXTG-Forge pod — 3 repos + 1 free pane in one tmux session.
# Spawn:  cosmux start pod-forge
# Stop:   cosmux stop  pod-forge
#
# YAML gotcha: bare `~` is null. Always quote tildes.
name: pod-forge
root: "~/projects/NXTG-Forge"
template: claude-team-pane

before_start:
  - "git -C ~/projects/NXTG-Forge/forge-ui pull --rebase || true"
  - "git -C ~/projects/NXTG-Forge/forge-plugin pull --rebase || true"
  - "git -C ~/projects/NXTG-Forge/forge-orchestrator pull --rebase || true"

after_start: []

on_pane_dead:
  - "echo \"$(date -Iseconds) pod-forge pane died\" >> /tmp/cosmux-pane-dead.log"

windows:
  - name: claude
    layout: tiled
    panes:
      - cwd: "~/projects/NXTG-Forge/forge-ui"
      - cwd: "~/projects/NXTG-Forge/forge-plugin"
      - cwd: "~/projects/NXTG-Forge/forge-orchestrator"
      - cwd: "~/projects/NXTG-Forge"
        command: ""   # bash, not ccyolo — free pane for ad-hoc commands
