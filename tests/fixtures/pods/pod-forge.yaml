# Synthetic four-project regression fixture. No production repository paths.
name: pod-sample-suite
root: "~/projects/sample-suite"
template: claude-team-pane

before_start: []
after_start: []
on_pane_dead:
  - "echo pane-recovered >> /tmp/forge-fixture.log"

windows:
  - name: projects
    layout: tiled
    panes:
      - cwd: "~/projects/sample-suite/ui"
      - cwd: "~/projects/sample-suite/plugin"
      - cwd: "~/projects/sample-suite/orchestrator"
      - cwd: "~/projects/sample-suite"
        command: ""
