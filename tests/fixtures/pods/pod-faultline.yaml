# Synthetic three-surface regression fixture. No production project names or paths.
name: pod-sample-platform
root: "~/projects"

before_start: []
after_start: []
on_pane_dead:
  - "echo pane-recovered >> /tmp/forge-fixture.log"

windows:
  - name: platform
    layout: tiled
    panes:
      - cwd: "~/projects/sample-engine"
      - cwd: "~/projects/sample-web"
      - cwd: "~/projects/sample-demo"
