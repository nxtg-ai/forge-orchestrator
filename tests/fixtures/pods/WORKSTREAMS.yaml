# Synthetic multi-project regression fixture. No production topology or private paths.
name: SAMPLE_WORKSTREAMS
template: claude-team-pane

before_start: []
after_start: []
on_pane_dead:
  - "echo pane-recovered >> /tmp/forge-fixture.log"

windows:
  - name: services
    layout: tiled
    panes:
      - cwd: "~/projects/sample-api"
      - cwd: "~/projects/sample-web"
  - name: workers
    layout: tiled
    panes:
      - cwd: "~/projects/sample-worker-a"
      - cwd: "~/projects/sample-worker-b"
  - name: tools
    layout: tiled
    panes:
      - cwd: "~/projects/sample-tool-a"
      - cwd: "~/projects/sample-tool-b"
  - name: review
    layout: tiled
    panes:
      - cwd: "~/projects/sample-review"
