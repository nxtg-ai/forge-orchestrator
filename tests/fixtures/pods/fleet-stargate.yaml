# fleet-stargate — the cockpit with the FULL interactive forge Stargate below.
# Spawn:  nxtg fleet bloom --stargate   (== cosmux start fleet-stargate --attach)
# Top: the live context-budget HUD. Bottom: forge's interactive Stargate
# dashboard (PTY agent panes / task board) for an active project. The Stargate
# gates once on a subscription-auth confirm — dismiss it and you're in.
name: fleet-stargate
root: "~/ASIF"

before_start: []
on_pane_dead:
  - "echo \"$(date -Iseconds) fleet-stargate pane died\" >> /tmp/cosmux-pane-dead.log"

windows:
  - name: command-center
    layout: even-vertical
    panes:
      # TOP: the glance — live ctx% + diet across every live Claude pane.
      - cwd: "~/ASIF"
        command: "~/ASIF/scripts/fleet/fleet-hud --watch 5"
      # BOTTOM: the full interactive forge Stargate (active project = synapps).
      - cwd: "~/projects/synapps"
        command: "forge dashboard"
