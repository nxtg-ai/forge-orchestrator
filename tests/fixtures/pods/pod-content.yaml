# Synthetic three-project regression fixture. No private repository names or paths.
name: pod-sample-content
root: "~/projects"

before_start: []
after_start: []
on_pane_dead:
  - "echo pane-recovered >> /tmp/forge-fixture.log"

windows:
  - name: projects
    layout: tiled
    panes:
      - cwd: "~/projects/sample-content"
      - cwd: "~/projects/sample-site"
      - cwd: "~/projects/sample-analytics"
