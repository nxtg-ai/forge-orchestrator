# Synthetic dashboard regression fixture. No production control-plane paths.
name: sample-dashboard
root: "~/projects/sample-suite"

before_start: []
after_start: []
on_pane_dead:
  - "echo pane-recovered >> /tmp/forge-fixture.log"

windows:
  - name: dashboard
    layout: even-vertical
    panes:
      - cwd: "~/projects/sample-suite"
        command: "echo status"
      - cwd: "~/projects/sample-suite/sample-app"
        command: "echo tasks"
