# fleet — the ASIF Terminal Command Center (cosmux pod).
# Spawn:  nxtg fleet bloom    (== cosmux start fleet --attach)
# One window, two live tiles: the context-budget HUD on top, forge state below.
# For the full interactive forge Stargate, swap the forge pane command to
# "forge dashboard" (gates on a one-time subscription-auth confirm).
name: fleet
root: "~/ASIF"

before_start: []
on_pane_dead:
  - "echo \"$(date -Iseconds) fleet pane died\" >> /tmp/cosmux-pane-dead.log"

windows:
  - name: command-center
    layout: even-vertical
    panes:
      # TOP (main): the glance — live ctx% + diet across every live Claude pane.
      - cwd: "~/ASIF"
        command: "~/ASIF/scripts/fleet/fleet-hud --watch 5"
      # BELOW: compact forge orchestration summary for an ACTIVE project
      # (synapps: 150+ tasks). Change the project arg to track another.
      - cwd: "~/ASIF"
        command: "~/ASIF/scripts/fleet/forge-tile synapps"
