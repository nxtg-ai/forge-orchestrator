# Dx³ pod — Universal Intelligence Platform team workspace.
# claude window for code work + api window for the running server.
#
# Spawn: cosmux start pod-dx3
name: pod-dx3
root: "~/projects/dx3"

before_start:
  - "git -C ~/projects/dx3 pull --rebase || true"

after_start: []

on_pane_dead:
  - "echo \"$(date -Iseconds) pod-dx3 pane died\" >> /tmp/cosmux-pane-dead.log"

windows:
  - name: claude
    layout: tiled
    panes:
      - cwd: "~/projects/dx3"
        command: "ccyolo"

  - name: api
    layout: tiled
    panes:
      - cwd: "~/projects/dx3"
        command: ""  # bash; team starts the API on demand
