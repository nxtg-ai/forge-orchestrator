[package]
name = "forge-orchestrator"
version = "1.5.2"
edition = "2024"
description = "Orchestrate Claude Code, Codex CLI, and Gemini CLI on shared repos — single Rust binary, zero deps."
license = "FSL-1.1-ALv2"
repository = "https://github.com/nxtg-ai/forge-orchestrator"
keywords = ["ai", "orchestration", "claude", "codex", "gemini"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
# Shell completions for `forge pod completions` — cosmux parity (FPL ruling 2026-07-18:
# the parity contract outranks dependency minimization).
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP client (for LLM API calls) — rustls avoids system OpenSSL dependency
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Environment variable loading
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Terminal UI
colored = "3"
indicatif = "0.17"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

# flock(2) for the pod adoption journal lock — the same primitive `flock(1)` uses, which is what
# lets the standalone rollback script block against a live locked operation instead of racing it.
# Already resolved transitively (see Cargo.lock); declaring it adds zero new compiled crates.
libc = "0.2"

# Statusline signature matching — the fleet ctx% HUD (W2-C) matches each tool's EXACT statusline
# regex (FPL round-7 ruling: the regex IS the spec, no hand-rolled predicate latitude). Already
# resolved transitively (see Cargo.lock); declaring it adds zero new compiled crates.
regex = "1"

# Filesystem traversal
walkdir = "2"

# UUID for task IDs
uuid = { version = "1", features = ["v4"] }

# Random delays for subscription pacing
rand = "0.9"

# PTY allocation (WezTerm-proven, cross-platform)
portable-pty = "0.9"
# Full virtual terminal emulator (proper cursor, scroll regions, alt screen)
vt100 = "0.15"

# Structured logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# File watching (future: detect completions)
# notify = "7"

# Git operations
# git2 = "0.19"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip debug symbols
