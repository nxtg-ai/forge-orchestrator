name: Install script companion plugin

# install.sh adds the Claude Code companion plugin through the claude CLI and nothing else
# (DIRECTIVE-NXTG-20261014-12 Part O). tests/install/companion.sh runs the real installer with a
# stub claude in an empty HOME: claude present, re-run, install failure, no claude, opt-out.
on:
  pull_request:
    paths: [install.sh, tests/install/**, .github/workflows/install-companion.yml]
  push:
    branches: [main]
    paths: [install.sh, tests/install/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    name: install.sh adds the companion plugin only through the claude CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tests/install/companion.sh install.sh
