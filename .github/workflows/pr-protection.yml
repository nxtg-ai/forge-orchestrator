name: PR Protection
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
  pull-requests: write
env:
  CARGO_TERM_COLOR: always
  MIN_TEST_COUNT: 564

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan for unsafe Rust patterns
        id: scan
        run: |
          echo "## Security Scan" > security-report.txt
          ISSUES=0
          for PAT in 'unsafe\s*{' 'std::process::Command' '\*mut ' '\*const ' 'extern\s*\"C\"' 'from_raw_parts'; do
            HITS=$(grep -rn "$PAT" src/ --include='*.rs' || true)
            if [ -n "$HITS" ]; then
              echo "### Pattern: \`$PAT\`" >> security-report.txt
              echo '```' >> security-report.txt
              echo "$HITS" >> security-report.txt
              echo '```' >> security-report.txt
              ISSUES=$((ISSUES + $(echo "$HITS" | wc -l)))
            fi
          done
          [ "$ISSUES" -eq 0 ] && echo "No unsafe patterns found." >> security-report.txt
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: security-report, path: security-report.txt }

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with: { toolchain: stable, components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - name: Run tests and verify count
        run: |
          OUTPUT=$(cargo test 2>&1)
          echo "$OUTPUT"
          PASSED=$(echo "$OUTPUT" | grep -oP '\d+ passed' | grep -oP '\d+' | awk '{s+=$1} END{print s+0}')
          echo "Tests passed: ${PASSED:-0}"
          if [ "${PASSED:-0}" -lt "$MIN_TEST_COUNT" ]; then
            echo "::error::Test count ${PASSED:-0} < minimum $MIN_TEST_COUNT"
            exit 1
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install and run cargo-audit
        run: |
          cargo install cargo-audit --quiet
          # RUSTSEC-2025-0119 (number_prefix unmaintained) is upstream-blocked on
          # indicatif 0.18; ignore until indicatif publishes a new major release.
          # Re-evaluate: 2026-08-03 (90 days).
          cargo audit --ignore RUSTSEC-2025-0119

  build-check:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [security-scan, quality-gate, dependency-audit, build-check]
    if: always()
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: security-report }
        continue-on-error: true
      - name: Post summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          # GITHUB_TOKEN (pull-requests: write above) is enough to comment. The NXTG_SENTINEL_TOKEN
          # PAT returned 401 Bad credentials, and `||` only falls back when a secret is empty.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const jobs = ${{ toJSON(needs) }};
            const icon = s => s === 'success' ? ':white_check_mark:' : ':x:';
            let body = `## PR Protection Summary\n| Check | Status |\n|-------|--------|\n`;
            for (const [k,v] of Object.entries(jobs))
              body += `| ${k} | ${icon(v.result)} |\n`;
            body += '\n';
            try { body += fs.readFileSync('security-report.txt', 'utf8'); } catch {}
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number });
            const bot = comments.find(c => c.body?.startsWith('## PR Protection'));
            const p = {owner: context.repo.owner, repo: context.repo.repo, body};
            if (bot) await github.rest.issues.updateComment({...p, comment_id: bot.id});
            else await github.rest.issues.createComment({...p, issue_number: context.issue.number});
