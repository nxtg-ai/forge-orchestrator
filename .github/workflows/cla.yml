name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/.github/CLA.md'
          branch: main
          allowlist: dependabot[bot]
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, you need to sign our Contributor License Agreement (CLA).

            Please read the [CLA document](${{ github.server_url }}/${{ github.repository }}/blob/main/.github/CLA.md) and reply with the following comment to agree:

            > I have read the CLA Document and I hereby sign the CLA

          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
