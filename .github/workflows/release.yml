name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: forge
            archive: forge-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: forge
            archive: forge-linux-aarch64.tar.gz
            cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: forge
            archive: forge-macos-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: forge
            archive: forge-macos-aarch64.tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: forge.exe
            archive: forge-windows-x86_64.zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl target)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.artifact }}
          cd ../../..
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so `sha256sum -c` works on Linux/macOS (Out-File writes CRLF).
          [IO.File]::WriteAllText("$PWD/${{ matrix.archive }}.sha256", "$hash  ${{ matrix.archive }}`n")

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  # Execute every packaged binary on a host of its own OS and architecture before anything is
  # published: a target that builds but does not run never reaches a release.
  smoke:
    name: Smoke ${{ matrix.archive }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive: forge-linux-x86_64.tar.gz
            os: ubuntu-latest
          - archive: forge-linux-aarch64.tar.gz
            os: ubuntu-24.04-arm
          - archive: forge-macos-x86_64.tar.gz
            os: macos-15-intel
          - archive: forge-macos-aarch64.tar.gz
            os: macos-latest
          - archive: forge-windows-x86_64.zip
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.archive }}
      # STAGE comes from the tagged commit (sparse checkout keeps root files), so the binary must
      # print exactly the label the tag declares.
      - name: Run the packaged binary
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: bash .github/scripts/smoke-binary.sh "$ARCHIVE" "${GITHUB_REF_NAME#v}" STAGE

  release:
    name: Create Release
    # The release is created only after every packaged binary ran (smoke) and the tagged SHA
    # passed CI.
    needs: [build, smoke, ci]
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow default: contents: write creates the release;
    # id-token: write and attestations: write let attest-build-provenance sign and store the
    # provenance of each archive.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # The MCP Registry only accepts MCPB URLs that contain "mcp", so the three platforms
      # listed in server.json are also published under forge-mcp-server-* names (byte copies).
      - name: Add MCP Registry asset names
        run: |
          cp artifacts/forge-linux-x86_64.tar.gz  artifacts/forge-mcp-server-linux-x86_64.tar.gz
          cp artifacts/forge-macos-aarch64.tar.gz artifacts/forge-mcp-server-macos-aarch64.tar.gz
          cp artifacts/forge-windows-x86_64.zip   artifacts/forge-mcp-server-windows-x86_64.zip

      # Signed SLSA build provenance for every release archive (the forge-mcp-server-* copies
      # included), stored in GitHub's attestation store. Verify a downloaded asset with
      #   gh attestation verify <archive> --repo nxtg-ai/forge-orchestrator \
      #     --signer-workflow nxtg-ai/forge-orchestrator/.github/workflows/release.yml
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Forge v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/*
          body: |
            ## Install

            **One-liner (Linux/macOS):**
            ```bash
            curl -fsSL https://forge.nxtg.ai/install.sh | sh
            ```

            **Manual download:**
            | Platform | Binary |
            |----------|--------|
            | Linux x86_64 | `forge-linux-x86_64.tar.gz` |
            | Linux ARM64 | `forge-linux-aarch64.tar.gz` |
            | macOS x86_64 | `forge-macos-x86_64.tar.gz` |
            | macOS ARM64 (Apple Silicon) | `forge-macos-aarch64.tar.gz` |
            | Windows x86_64 | `forge-windows-x86_64.zip` |

            **From source:**
            ```bash
            cargo install --path .
            ```

  # Runs only after the release job has uploaded every asset. Pre-release tags are skipped.
  mcp-registry:
    name: MCP Registry
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/mcp-publish.yml
    with:
      tag: ${{ github.ref_name }}

  # crates.io through trusted publishing (OIDC): crates.io trusts this workflow in this repo and
  # issues a token that lives for this one job. No crates.io token is stored in GitHub or on a
  # machine. It runs once per release tag, after the release job has uploaded every asset.
  # Pre-release tags are skipped, as for the MCP Registry.
  crates-io:
    name: crates.io
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Pinned to full commit SHAs: this job holds publish authority (id-token: write).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: The tag matches the Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check
