name: Stale Issues & PRs

on:
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Outside authors are never marked stale (emma-soul al:66c6c92e0cfbf5a2): label their open
      # issues and PRs `community`, which actions/stale exempts below. Tested by tests/stale/community.sh.
      - name: Label outside authors' open issues and PRs community
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create community --color 0E8A16 --description "Opened by someone outside the org; the stale bot skips it" 2>/dev/null || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | {number, author_association, user_type: .user.type, labels: [.labels[].name]}' > open-items.jsonl
          for n in $(python3 .github/scripts/community-label.py open-items.jsonl); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/labels" -f 'labels[]=community' >/dev/null
            echo "labelled #$n community"
          done
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had activity in 30 days. It will be closed in 7 days if no further
            activity occurs. Comment or remove the stale label to keep it open.
          close-issue-message: >
            Closed due to inactivity. Feel free to reopen if still relevant.

          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had activity in 45 days. It will be closed in 14 days if no further
            activity occurs.
          close-pr-message: >
            Closed due to inactivity. Feel free to reopen to continue work.

          exempt-issue-labels: 'pinned,security,blocked,in-progress,community'
          exempt-pr-labels: 'pinned,security,blocked,in-progress,community'
          exempt-draft-pr: true
          operations-per-run: 100
          remove-stale-when-updated: true
