name: Install script sync

# install.sh in this repo is the single source of truth. https://forge.nxtg.ai/install.sh
# must serve the same bytes; this fails (and opens an issue) when the two drift.
on:
  schedule:
    - cron: '30 8 * * *'  # 08:30 UTC daily
  push:
    branches: [main]
    paths: [install.sh]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  compare:
    name: forge.nxtg.ai serves repo install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare sha256 of served and repo bytes
        run: |
          curl -fsSL https://forge.nxtg.ai/install.sh -o served.sh
          repo=$(sha256sum install.sh | cut -d' ' -f1)
          served=$(sha256sum served.sh | cut -d' ' -f1)
          echo "repo   $repo"
          echo "served $served"
          if [ "$repo" != "$served" ]; then
            diff install.sh served.sh || true
            echo "::error::forge.nxtg.ai/install.sh differs from install.sh on main"
            exit 1
          fi
          sh -n served.sh

      - name: Create issue on drift
        uses: jayqi/failed-build-issue-action@v1
        if: failure()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # End-to-end: the installer must find and install the latest release without api.github.com
  # (its unauthenticated limit, 60/hour per IP, runs out on shared runners and offices).
  no-api-install:
    name: install.sh works with api.github.com blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with a curl shim that refuses api.github.com
        run: |
          mkdir -p shim
          real=$(command -v curl)
          # shellcheck disable=SC2016  # the shim's $@/$a must stay literal
          printf '#!/bin/sh\nfor a in "$@"; do case "$a" in *api.github.com*) echo "blocked: $a" >&2; exit 22;; esac; done\nexec %s "$@"\n' "$real" > shim/curl
          chmod +x shim/curl
          PATH="$PWD/shim:$PATH" FORGE_INSTALL_DIR="$PWD/bin" sh install.sh
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/${{ github.repository }}/releases/latest | sed 's|.*/tag/v||')
          "$PWD/bin/forge" --version | tee version.txt
          grep -qF "forge $latest " version.txt

      - name: Create issue on failure
        uses: jayqi/failed-build-issue-action@v1
        if: failure()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
