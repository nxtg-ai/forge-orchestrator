name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

      - name: Create issue on CI failure
        uses: jayqi/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        if: failure() && github.event.pull_request == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Windows COMPILE-check only — not the full test suite (PTY + Instant-timing tests are
  # Windows-incompatible, so Windows was dropped from the test matrix). `forge pod` is
  # #[cfg(unix)]-gated, so it is out of this build; this job's job is to catch a NON-gated Unix-only
  # API leaking into always-compiled code before it reaches a release (DIRECTIVE-NXTG-20260719-22:
  # a pod change broke the Windows release leg because nothing compiled Windows until release.yml).
  windows-build:
    name: Windows build check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `cargo build --locked` compiles the binary (src/) only — NOT the integration tests, which
      # are Unix-only (tmux/bash/flock) and are never run on Windows — and fails on any Cargo.lock
      # drift. This is the compile-check that would have caught the ungated pod module before release.
      - run: cargo build --locked

      - name: Create issue on CI failure
        uses: jayqi/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        if: failure() && github.event.pull_request == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # DIRECTIVE-NXTG-20261015-07: the Codex adapter's real argv must parse under the pinned codex-cli
  # and let a forge MCP call through. codex runs only in a --network none container (BROWSER=/bin/false)
  # against a local mock model: $0, no credential. The red controls prove the check can fail.
  codex-argv:
    name: Codex argv (codex-cli 0.162.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - name: Adapter argv parses and forge MCP calls go through
        run: bash tests/codex/argv-check.sh
      - name: Codex argv red controls
        run: bash tests/codex/red-controls.sh

      - name: Create issue on CI failure
        uses: jayqi/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        if: failure() && github.event.pull_request == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the CHANGELOG check reads the commits since the last tag
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check
      # install.sh is piped to `sh`: any CR breaks it. Reject CR in every tracked *.sh, then parse it.
      - name: Shell scripts are LF and install.sh parses
        run: |
          crlf=$(git ls-files -z '*.sh' | xargs -0 grep -l $'\r' || true)
          if [ -n "$crlf" ]; then echo "::error::CR line endings in: $crlf"; exit 1; fi
          sh -n install.sh
      # Forge FREEZE (DIRECTIVE-NXTG-20261015-08): install.sh installs the release its TAG pins, never releases/latest.
      - name: install.sh installs the pinned release
        run: sh tests/install/pin.sh
      # The stale bot never marks an outside author's issue or PR stale.
      - name: Stale bot exempts outside authors
        run: bash tests/stale/community.sh
      # Red control: the installer before the pin (de67cdb) followed releases/latest and must fail.
      - name: Pin check red control
        run: |
          git fetch -q --depth=1 origin de67cdb14733af68cac413f385f7111441819dbd
          git show FETCH_HEAD:install.sh > "$RUNNER_TEMP/install-before-pin.sh"
          if sh tests/install/pin.sh "$RUNNER_TEMP/install-before-pin.sh" > red.txt 2>&1; then
            cat red.txt; echo "::error::the pin check passed the installer that follows releases/latest"; exit 1
          fi
          cat red.txt
          grep -qF 'FAIL asks GitHub for releases/latest' red.txt
      # install.sh fails closed (DIRECTIVE-NXTG-20261110-02): no .sha256 or no SHA-256 tool means
      # nothing is installed.
      - name: install.sh fails closed on the checksum
        run: sh tests/install/checksum.sh
      # Red control: the installer before this check (90e077d) skipped verification in both cases.
      - name: Checksum check red control
        run: |
          # No shallow fetch here: it would cut the history the CHANGELOG red controls read.
          # fetch-depth: 0 above already has 90e077d.
          git show 90e077d2b429ff8841e2551390261f24aadeccb3:install.sh > "$RUNNER_TEMP/install-before-checksum.sh"
          if sh tests/install/checksum.sh "$RUNNER_TEMP/install-before-checksum.sh" > red.txt 2>&1; then
            cat red.txt; echo "::error::the checksum check passed the installer that skips verification"; exit 1
          fi
          cat red.txt
          grep -A1 -F '== checksum file missing' red.txt | grep -qF 'FAIL exits 0'
          grep -A1 -F '== no SHA-256 tool' red.txt | grep -qF 'FAIL exits 0'
      # The release stage lives in one root file, STAGE; every surface must agree with it.
      - name: Stage surfaces match STAGE
        run: cargo build --locked && bash .github/scripts/check-stage.sh target/debug/forge
      # The check must also go red: old pre-alpha text, a changed ruled sentence, a stale STAGE.
      - name: Stage check red controls
        run: bash tests/stage/red-controls.sh
      # Docs from code (EMMA-SOUL Dx3 73d06ff8 item 6): README CLI text, CHANGELOG, Cargo.toml metadata.
      # The library's public API (forge_orchestrator::core) must document cleanly; docs.rs builds the same.
      - name: Library docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --lib --locked
      # examples/: mcp_stdio creates a task through forge mcp, task_board reads it via the library.
      - name: Examples run
        run: bash tests/examples/run.sh target/debug/forge
      - name: Examples red controls
        run: bash tests/examples/red-controls.sh target/debug/forge
      - name: README CLI matches forge --help
        run: python3 .github/scripts/readme-cli.py --forge target/debug/forge
      - name: Cargo.toml metadata
        # --allow-dirty: earlier steps leave scratch files (red.txt) in the checkout; this proves the
        # crate packages, not that the tree is clean.
        run: python3 .github/scripts/check-cargo-meta.py && cargo package --list --locked --allow-dirty > /dev/null
      - name: Docs gates red controls
        # Title-independent: CI does not re-run on a PR title edit, so the PR's own CHANGELOG line is
        # checked only by conventional.yml (which does). Here the committed-CHANGELOG baseline runs
        # on push; the red cases run everywhere.
        env:
          CHANGELOG_REV: ${{ github.event.pull_request.base.sha || 'HEAD' }}
          CHANGELOG_BASELINE: ${{ github.event_name == 'pull_request' && 'skip' || 'run' }}
        run: bash tests/docs-gates/red-controls.sh target/debug/forge
      # The third CLI is Antigravity CLI (agy); current docs and help must not say Gemini CLI.
      - name: Docs and help name Antigravity CLI (agy)
        run: bash .github/scripts/check-agy-naming.sh target/debug/forge
      - name: agy naming red controls
        run: bash tests/agy/red-controls.sh

      - name: Create issue on CI failure
        uses: jayqi/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        if: failure() && github.event.pull_request == null
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
