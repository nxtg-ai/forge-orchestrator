name: Publish to MCP Registry

# Called by release.yml after the release assets are uploaded, or run by hand for
# an existing tag. It no longer listens for `release: published`: that event fired
# on the manual `gh release create` before release.yml had uploaded any assets, and
# a release created by release.yml's GITHUB_TOKEN would not fire it at all.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.6.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.6.2)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
      # Workflow's own commit, for the stamp script (an older tag may predate it).
      - uses: actions/checkout@v4
      # The tag being published, for server.json and Cargo.toml.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: release

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      # Version, asset URLs and sha256s come from the release, never from a hand edit.
      - name: Stamp server.json from the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/scripts/stamp-server-json.sh "${{ inputs.tag }}" server.json

      - name: Validate server.json
        run: ./mcp-publisher validate release/server.json

      - name: Authenticate with MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish release/server.json
