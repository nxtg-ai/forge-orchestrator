name: PR title and CHANGELOG

# Squash merges make the PR title the commit on main, and CHANGELOG.md's generated block is built
# from those subjects (.github/scripts/changelog.py). This runs on title edits too, since the title
# is part of the expected CHANGELOG.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional title and generated CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: PR title is a conventional commit subject
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/pr-title.py "$TITLE"
      - name: CHANGELOG generated block matches the commits since the last tag
        env:
          REV: ${{ github.event.pull_request.base.sha || 'HEAD' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SUBJECT: ${{ github.event.pull_request.number && format('{0} (#{1})', github.event.pull_request.title, github.event.pull_request.number) || '' }}
        run: |
          if [ -n "$SUBJECT" ]; then
            # The squash body keeps the PR's commit messages, so a BREAKING CHANGE footer in any of
            # them lands on main; mark this PR's entry breaking now.
            breaking=()
            if git log --format=%b "$REV..$PR_HEAD" | grep -qE '^BREAKING[ -]CHANGE: '; then breaking=(--with-breaking); fi
            python3 .github/scripts/changelog.py --check --rev "$REV" --with "$SUBJECT" "${breaking[@]}"
          else
            python3 .github/scripts/changelog.py --check --rev "$REV"
          fi
